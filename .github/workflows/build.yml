name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            file: reaper_bazz.dylib
          - os: windows-latest
            file: Release/reaper_bazz.dll
          - os: ubuntu-latest
            file: reaper_bazz.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBAZZ_DEV=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target reaper_bazz graph_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: build/${{ matrix.file }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "bazz ${GITHUB_REF_NAME#v}" --notes "Needs ReaImGui." || true
          gh release upload "$GITHUB_REF_NAME" "build/${{ matrix.file }}" --clobber
